<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kilosort4 参数快速检索</title>
<style>
  :root {
    --bg: #0d1117; --card-bg: #161b22; --border: #30363d;
    --text: #c9d1d9; --text2: #8b949e; --accent: #58a6ff;
    --accent2: #f78166; --tag-bg: #1c2128; --hl: rgba(255,235,59,0.45);
    --step-data: #58a6ff; --step-pre: #3fb950; --step-spike: #d29922;
    --step-cluster: #f78166; --step-post: #bc8cff; --step-runtime: #8b949e;
    --badge-bg: #21262d;
  }
  * { box-sizing:border-box; margin:0; padding:0 }
  body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; min-height:100vh }
  .container { max-width:1400px; margin:0 auto; padding:24px 20px }

  /* Header */
  header { text-align:center; padding:48px 20px 32px; border-bottom:1px solid var(--border); margin-bottom:32px }
  header h1 { font-size:2rem; font-weight:700; margin-bottom:8px; letter-spacing:-0.5px }
  header h1 span { color:var(--accent) }
  header p { color:var(--text2); font-size:0.95rem }
  .stats { display:flex; gap:24px; justify-content:center; margin-top:16px; flex-wrap:wrap }
  .stat { background:var(--badge-bg); padding:8px 18px; border-radius:20px; font-size:0.85rem; color:var(--text2) }
  .stat strong { color:var(--text); margin-right:4px }

  /* Toolbar */
  .toolbar { display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap; align-items:center; position:sticky; top:0; z-index:100; background:var(--bg); padding:12px 0 }
  .search-wrap { flex:1; min-width:280px; position:relative }
  .search-wrap input { width:100%; padding:10px 16px 10px 40px; border:1px solid var(--border); border-radius:8px; background:var(--card-bg); color:var(--text); font-size:0.95rem; outline:none; transition:border-color .2s }
  .search-wrap input:focus { border-color:var(--accent) }
  .search-wrap .icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--text2); font-size:1rem; pointer-events:none }
  .badge-filter { display:flex; gap:6px; flex-wrap:wrap }
  .badge { padding:6px 14px; border-radius:16px; font-size:0.8rem; cursor:pointer; border:1px solid var(--border); background:var(--badge-bg); color:var(--text2); transition:all .15s; user-select:none; white-space:nowrap }
  .badge:hover { border-color:var(--text2) }
  .badge.active { color:#fff; border-color:transparent }
  .badge.step-data.active { background:var(--step-data) }
  .badge.step-pre.active { background:var(--step-pre) }
  .badge.step-spike.active { background:var(--step-spike) }
  .badge.step-cluster.active { background:var(--step-cluster) }
  .badge.step-post.active { background:var(--step-post) }
  .badge.step-runtime.active { background:var(--step-runtime); color:#fff }
  .result-count { font-size:0.85rem; color:var(--text2); white-space:nowrap }

  /* Cards */
  .param-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(420px, 1fr)); gap:16px }
  .param-card { background:var(--card-bg); border:1px solid var(--border); border-radius:10px; padding:20px; transition:border-color .2s, box-shadow .2s; cursor:default }
  .param-card:hover { border-color:#484f58; box-shadow:0 4px 12px rgba(0,0,0,.2) }
  .param-card.hidden { display:none }
  .param-card .num { font-size:0.75rem; color:var(--text2); font-weight:600; margin-bottom:6px }
  .param-card .name { font-family:"SF Mono","Fira Code","Consolas",monospace; font-size:1.05rem; font-weight:700; color:var(--accent); margin-bottom:2px; word-break:break-all }
  .param-card .alias { font-size:0.85rem; color:var(--text2); margin-bottom:12px }
  .param-card .desc { font-size:0.9rem; color:var(--text); margin-bottom:14px; line-height:1.65 }
  .param-card .recommend { font-size:0.88rem; color:#7ee787; background:rgba(63,185,80,.08); padding:10px 14px; border-radius:6px; border-left:3px solid #3fb950; line-height:1.6 }
  .param-card .recommend strong { color:#7ee787 }
  .props { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px }
  .prop { display:inline-flex; align-items:center; gap:5px; font-size:0.78rem; padding:4px 10px; border-radius:12px; background:var(--badge-bg); color:var(--text2) }
  .prop .pv { color:var(--text); font-weight:600; font-family:"SF Mono","Fira Code","Consolas",monospace }
  .prop .pk { color:var(--text2) }
  .tags { display:flex; gap:6px; flex-wrap:wrap }
  .tag { display:inline-block; font-size:0.7rem; padding:3px 9px; border-radius:10px; font-weight:600; letter-spacing:0.3px; text-transform:uppercase }
  .tag.data { background:rgba(88,166,255,.15); color:var(--step-data) }
  .tag.preprocessing { background:rgba(63,185,80,.15); color:var(--step-pre) }
  .tag.spike-detection, .tag.spike { background:rgba(210,153,34,.15); color:var(--step-spike) }
  .tag.clustering { background:rgba(247,129,102,.15); color:var(--step-cluster) }
  .tag.postprocessing { background:rgba(188,140,255,.15); color:var(--step-post) }
  .tag.runtime { background:rgba(139,148,158,.15); color:var(--step-runtime) }

  /* Highlight */
  mark { background:var(--hl); color:var(--text); border-radius:2px; padding:0 2px }

  /* Section headings */
  .section-hd { grid-column:1/-1; margin-top:28px; margin-bottom:-8px; padding-bottom:8px; border-bottom:1px solid var(--border) }
  .section-hd h2 { font-size:1.25rem; font-weight:700 }
  .section-hd h2 .st { color:var(--text2); font-weight:400 }

  /* Quick table */
  .quick-table-wrap { overflow-x:auto; margin-top:24px }
  .quick-table { width:100%; border-collapse:collapse; font-size:0.85rem }
  .quick-table th { text-align:left; padding:10px 14px; background:var(--card-bg); border-bottom:2px solid var(--border); position:sticky; top:0; font-weight:600; cursor:pointer; white-space:nowrap; user-select:none }
  .quick-table th:hover { color:var(--accent) }
  .quick-table th .arr { margin-left:4px; font-size:0.7rem }
  .quick-table td { padding:8px 14px; border-bottom:1px solid var(--border) }
  .quick-table tr:hover td { background:rgba(88,166,255,.04) }
  .quick-table .pn { font-family:"SF Mono","Fira Code","Consolas",monospace; color:var(--accent); font-weight:600 }
  .quick-table .pd { font-family:"SF Mono","Fira Code","Consolas",monospace; color:var(--accent2); font-size:0.82rem }
  .qtoolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px }
  .toggle-view { font-size:0.85rem; color:var(--accent); cursor:pointer; background:none; border:1px solid var(--border); border-radius:6px; padding:6px 14px }
  .toggle-view:hover { border-color:var(--accent) }

  /* Responsive */
  @media (max-width:900px) { .param-grid { grid-template-columns:1fr } .container { padding:12px } }

  /* Scrollbar */
  ::-webkit-scrollbar { width:6px; height:6px }
  ::-webkit-scrollbar-track { background:var(--bg) }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px }

  footer { text-align:center; padding:40px 20px; color:var(--text2); font-size:0.8rem; border-top:1px solid var(--border); margin-top:48px }
</style>
</head>
<body>
<div class="container">

<header>
  <h1>Kilosort4 <span>参数快速检索</span></h1>
  <p>全部 51 个可调参数 — 默认值、含义、推荐值及调参建议</p>
  <div class="stats">
    <div class="stat"><strong>51</strong> 个参数</div>
    <div class="stat"><strong>6</strong> 个类别</div>
    <div class="stat"><strong>8</strong> 个主参数</div>
    <div class="stat"><strong>33</strong> 个扩展参数</div>
    <div class="stat"><strong>10</strong> 个运行时参数</div>
  </div>
</header>

<!-- Toolbar -->
<div class="toolbar">
  <div class="search-wrap">
    <span class="icon">&#128269;</span>
    <input type="text" id="search" placeholder="搜索参数名、含义、推荐值... （如 "阈值" "漂移" "GPU" "int"）" autofocus>
  </div>
  <div class="badge-filter" id="filterBadges">
    <span class="badge step-data active" data-step="data">Data</span>
    <span class="badge step-pre active" data-step="preprocessing">Preprocessing</span>
    <span class="badge step-spike active" data-step="spike detection">Spike Detect</span>
    <span class="badge step-cluster active" data-step="clustering">Clustering</span>
    <span class="badge step-post active" data-step="postprocessing">Postprocessing</span>
    <span class="badge step-runtime active" data-step="runtime">Runtime</span>
  </div>
  <span class="result-count" id="resultCount">51 / 51</span>
</div>

<!-- View Toggle -->
<div class="qtoolbar">
  <span style="font-weight:700;font-size:1.05rem" id="viewLabel">&#128203; 详细卡片视图</span>
  <button class="toggle-view" id="toggleView">切换到速查表视图</button>
</div>

<!-- Card View -->
<div class="param-grid" id="cardView"></div>

<!-- Quick Table View -->
<div class="quick-table-wrap" id="tableView" style="display:none">
  <table class="quick-table" id="quickTable">
    <thead><tr>
      <th data-sort="num"># <span class="arr"></span></th>
      <th data-sort="name">参数名 <span class="arr"></span></th>
      <th data-sort="default">默认值 <span class="arr"></span></th>
      <th data-sort="type">类型 <span class="arr"></span></th>
      <th data-sort="step">步骤 <span class="arr"></span></th>
      <th data-sort="range">取值范围 <span class="arr"></span></th>
      <th>含义摘要</th>
    </tr></thead>
    <tbody></tbody>
  </table>
</div>

</div>

<footer>
  Kilosort4 Parameter Reference &mdash; 基于 <code>kilosort/parameters.py</code> 及 <code>run_kilosort.py</code> 源码分析 &mdash; Generated 2026-05
</footer>

<script>
// ===== DATA =====
const params = [
  // MAIN
  {n:1, name:"n_chan_bin", alias:"通道总数", step:"data", type:"int", def:"None (必须由用户指定)", range:"> 0", desc:"二进制文件中存储的总通道数，可能与实际包含电生理数据的通道数不同。这是唯一一个必须由用户指定的参数，否则 run_kilosort 会抛出 ValueError。", rec:"根据实际数据文件确定。对于 Neuropixels 1.0 探针，通常为 385（384 个记录通道 + 1 个同步通道）。"},
  {n:2, name:"fs", alias:"采样频率", step:"data", type:"float", def:"30000", range:"> 0", desc:"探针的采样频率（Hz）。", rec:"通常为 30000 Hz（Neuropixels 默认值），根据实际采集设备设置。"},
  {n:3, name:"batch_size", alias:"批处理大小", step:"data", type:"int", def:"60000", range:"≥ 1", desc:"每次批处理包含的采样点数。较大的批量会消耗更多 GPU 内存但可能更快，较小的批量适合 GPU 内存受限的情况。", rec:"保持默认 60000（2秒数据@30kHz）。GPU 内存不足时可适当减小，如 30000。"},
  {n:4, name:"nblocks", alias:"漂移校正块数", step:"preprocessing", type:"int", def:"1", range:"≥ 0", desc:"用于漂移校正的非重叠块数量（实际会产生 2*nblocks-1 个包含重叠的块）。设为 0 可跳过漂移校正。", rec:"对于较长记录（>30分钟），建议设为 5；短记录可保持默认 1。增加块数可追踪更精细的时间漂移，但会增加计算时间。"},
  {n:5, name:"Th_universal", alias:"通用模板检测阈值", step:"spike detection", type:"float", def:"9", range:"> 0", desc:"通用模板的 spike 检测阈值（对应旧版 Kilosort 中的 Th(1)）。值越高越严格（检出更少的 spike），值越低越宽松（检出更多但可能包含更多噪声）。", rec:"默认 9。高密度探针（如 Neuropixels）数据质量较好时可用 [8, 10] 范围；低信噪比数据可降低到 7-8；极高信噪比可提高到 10-12。"},
  {n:6, name:"Th_learned", alias:"学习模板检测阈值", step:"spike detection", type:"float", def:"8", range:"> 0", desc:"学习到的模板的 spike 检测阈值（对应旧版 Kilosort 中的 Th(2)）。在第二阶段的模板匹配中使用，通常比 Th_universal 略低。", rec:"默认 8。一般比 Th_universal 低 0.5-1。若要检测更多的 spike 以增加 cluster 完整性，可降低到 7。"},
  {n:7, name:"tmin", alias:"数据起始时间", step:"data", type:"float", def:"0", range:"≥ 0", desc:"开始排序的数据起始时间（秒）。用于跳过记录开头的伪迹或不稳定部分。", rec:"默认 0。如果有开头伪迹，可能设为 5-30 秒。"},
  {n:8, name:"tmax", alias:"数据结束时间", step:"data", type:"float", def:"inf", range:"> 0", desc:"排序数据结束时间（秒）。默认处理到记录末尾。用于仅处理数据的一个子段。", rec:"默认 inf。仅用于选择性分析部分数据。"},

  // EXTRA - Data
  {n:9, name:"nt", alias:"波形采样点数", step:"data", type:"int (必须为奇数)", def:"61", range:"≥ 1", desc:"每个 spike 波形的采样点数和滤波的对称填充大小。必须为奇数。", rec:"默认 61（约 2ms @ 30kHz）。增加该值可捕获更长的波形但会增加计算量。使用预定义模板（templates_from_data=False）时，必须为 61。"},
  {n:10, name:"shift", alias:"数据偏移", step:"data", type:"float", def:"None", range:"无限制", desc:"在所有其他操作前对数据施加的标量偏移。通常不需要设置，但对 float32 数据可能需要。与 scale 配合使数据大致落在 [-100, +100] 范围内。", rec:"默认 None。仅在数据格式异常时使用（如 float32 数据有较大 DC 偏移时）。"},
  {n:11, name:"scale", alias:"数据缩放", step:"data", type:"float", def:"None", range:"无限制", desc:"在所有其他操作前对数据施加的缩放因子。数据变换为 data = data*scale + shift。", rec:"默认 None。仅在数据格式异常时使用。"},
  {n:12, name:"batch_downsampling", alias:"批下采样因子", step:"data", type:"int", def:"1", range:"≥ 1", desc:"每 N 个 batch 中只用 1 个。如设 batch_downsampling=10，仅每第 10 个 batch 用于排序。", rec:"默认 1（使用所有数据批次）。通常不应修改，仅在快速测试或资源受限时使用。"},

  // EXTRA - Preprocessing
  {n:13, name:"artifact_threshold", alias:"伪迹阈值", step:"preprocessing", type:"float", def:"inf", range:"≥ 0", desc:"若某个 batch 包含绝对值高于此阈值的数据，则将该 batch 归零（假设存在记录伪迹）。默认无穷大意味着不做任何归零。", rec:"默认 inf。如果数据有较大电噪声或运动伪迹，可设为合理值如 500-1000。大多数情况下应保持默认，避免误杀信号。"},
  {n:14, name:"nskip", alias:"白化矩阵批次步长", step:"preprocessing", type:"int", def:"25", range:"≥ 1", desc:"计算白化矩阵时跳过的批次步长。每隔 nskip 个批次采集一次数据来计算协方差矩阵。", rec:"默认 25。对于大多数数据无需修改。"},
  {n:15, name:"whitening_range", alias:"白化邻域范围", step:"preprocessing", type:"int", def:"32", range:"≥ 1", desc:"估计每个通道的白化矩阵时，使用的相邻通道数量。", rec:"默认 32。对于高密度探针来说是最优值；对于通道数较少的探针，系统会自动调整到不超过通道总数。"},
  {n:16, name:"highpass_cutoff", alias:"高通滤波截止频率", step:"preprocessing", type:"float", def:"300", range:"≥ 0", desc:"应用于数据的 Butterworth 高通滤波器的临界频率（Hz）。", rec:"默认 300 Hz。适用于大多数 spike 数据。如果 LFP 频段有强干扰，可提高到 400-500 Hz。降低可能保留更多低频信号但也可能引入漂移伪迹。"},
  {n:17, name:"binning_depth", alias:"漂移直方图垂直分箱", step:"preprocessing", type:"float", def:"5", range:"> 0", desc:"漂移校正中用于 2D 直方图的垂直分箱大小（微米）。", rec:"默认 5 μm。更小的值提供更高的空间分辨率但可能使漂移估计对噪声更敏感。"},
  {n:18, name:"sig_interp", alias:"空间平滑尺度", step:"preprocessing", type:"float", def:"20", range:"> 0", desc:"漂移校正的近似空间平滑尺度（微米）。控制用于插值的径向核的宽度。", rec:"默认 20 μm。与通道间距相关，对于典型 Neuropixels 探针（~20μm 间距），此值是合适的。减小该值可使插值更局部化，增大则更平滑。"},
  {n:19, name:"drift_smoothing", alias:"漂移估计平滑系数", step:"preprocessing", type:"list (3 floats)", def:"[0.5, 0.5, 0.5]", range:"无硬限制", desc:"对时空漂移估计施加的高斯平滑量，分别对应三个轴：相关性轴（建议不调整）、时间轴（以配准块为单位）、y 轴（以批次为单位）。当 nblocks=1 时，y 方向的平滑没有效果。", rec:"保持默认 [0.5, 0.5, 0.5]。不建议调整相关性轴的平滑。若漂移估计看起来过于颠簸，可适当提高平滑值。"},

  // EXTRA - Spike Detection
  {n:20, name:"nt0min", alias:"波形对齐点", step:"spike detection", type:"int", def:"None (自动设为 int(20*nt/61))", range:"≥ 0", desc:"波形对齐的样本索引，使波形的最小值或最大值出现在此位置。当 nt=61 时，默认值为 20（约在波形 1/3 处）。", rec:"默认自动计算。一般不需要手动调整。"},
  {n:21, name:"dmin", alias:"垂直模板间距", step:"spike detection", type:"float", def:"None (自动确定)", range:"> 0", desc:"用于 spike 检测的模板中心的垂直间距（微米）。当为 None 时，根据探针接触点的中位间距自动确定。", rec:"默认自动即可。如果自动值不合适，可手动设定为探针垂直间距的 1-2 倍。对于 Neuropixels 1.0（~20μm 间距），自动值通常约为 20。"},
  {n:22, name:"dminx", alias:"水平模板间距", step:"spike detection", type:"float", def:"32", range:"> 0", desc:"用于 spike 检测的模板中心的水平间距（微米）。默认 32μm 对 Neuropixels 1 和 Neuropixels 2 探针效果良好。", rec:"Neuropixels 1/2 保持 32。对于其他探针几何形状，建议先设为探针接触点的中位水平距离。如果检测到的 cluster 太少，可以减小该值以放置更多模板。"},
  {n:23, name:"min_template_size", alias:"最小模板大小", step:"spike detection", type:"float", def:"10", range:"> 0", desc:"通用模板的最小球形空间包络的高斯标准差。", rec:"默认 10。对于大多数探针是合适的。如果观察到大振幅的神经元数量较少，可降低到 5；如果主要关注小振幅神经元，可适当提高。"},
  {n:24, name:"template_sizes", alias:"模板尺寸数量", step:"spike detection", type:"int", def:"5", range:"≥ 1", desc:"通用模板的尺寸变体数量（min_template_size 的倍数）。更多尺寸可检测更多空间范围不同的神经元，但会增加计算量。", rec:"默认 5。对于大多数数据已足够。如果检测到多种空间范围的神经元（如同时有轴突和胞体信号），可增加到 6-7。"},
  {n:25, name:"nearest_chans", alias:"最近通道数", step:"spike detection", type:"int", def:"10", range:"≥ 1 (不超过通道总数)", desc:"在 spike 检测中寻找局部最大值时，考虑的最近通道数量。与探针几何相关：该值应确保足够多的通道出现来验证 spike。", rec:"默认 10。对于 Neuropixels 高密度探针效果良好。对于线性探针可以保持此值；对于 tetrodes 这种少通道配置，系统会自动调整。"},
  {n:26, name:"nearest_templates", alias:"最近模板数", step:"spike detection", type:"int", def:"100", range:"≥ 1", desc:"在 spike 检测中寻找局部最大值时，考虑的最近模板位置数量。", rec:"默认 100。保持默认值即可。"},
  {n:27, name:"max_channel_distance", alias:"最大通道距离", step:"spike detection", type:"float", def:"32", range:"≥ 1", desc:"距离其最近通道超过此值（微米）的模板将不会被使用。同时也限制了聚类期间比较通道之间的距离。", rec:"默认 32 μm。减小可加速计算但可能遗漏远离通道位置的信号；增大可包含更多空间上远离的模板。"},
  {n:28, name:"max_peels", alias:"匹配追踪迭代次数", step:"spike detection", type:"int", def:"100", range:"1 ~ 10000", desc:"在匹配追踪步骤中，对每批数据进行的最大迭代次数。更多的迭代可以检测更多重叠的 spike。", rec:"默认 100。对于高发放率或密集放电区域，可增加到 150-200 以更好地分离重叠 spike。降低可加快排序但可能漏检重叠 spike。"},
  {n:29, name:"templates_from_data", alias:"从数据估计模板", step:"spike detection", type:"bool", def:"True", range:"True 或 False", desc:"是否从数据中估计通用模板所用的 spike 形状。如果设为 False，则使用内置的预定义模板（此时 nt 必须为 61）。", rec:"默认 True。使用数据驱动的模板几乎总是更好的选择。仅在快速测试或数据异常时可设为 False。"},
  {n:30, name:"n_templates", alias:"单通道模板数", step:"spike detection", type:"int", def:"6", range:"≥ 1", desc:"用于构建通用模板的单通道模板数量（仅在 templates_from_data=True 时使用）。使用 K-Means 聚类从数据中提取的典型 spike 形状数。", rec:"默认 6。一般足够覆盖单通道的所有波形形状。增加可捕获更稀有的波形形状，但影响较小。"},
  {n:31, name:"n_pcs", alias:"PC 特征数", step:"spike detection", type:"int", def:"6", range:"≥ 1", desc:"提取 spike 特征时使用的单通道主成分（PC）数量（仅在 templates_from_data=True 时使用）。", rec:"默认 6。对于大多数场景，3-6 个 PCs 足以捕获 >90% 的波形方差。增加会提高特征维度但可能引入噪声成分；减少可能丢失波形细节。"},
  {n:32, name:"Th_single_ch", alias:"单通道阈值", step:"spike detection", type:"float", def:"6", range:"> 0", desc:"用于计算通用模板的单通道阈值穿越检测（以白化数据的标准差为单位）。", rec:"默认 6。较低值（4-5）可检测更多小振幅 spike 用于模板构建，但可能引入噪声；较高值（7-8）更保守。"},

  // EXTRA - Clustering
  {n:33, name:"acg_threshold", alias:"ACG 不应期阈值", step:"clustering", type:"float", def:"0.2", range:"> 0", desc:"在 ACG（自相关图）中允许的、相对于基线的不应期违规比例。用于判定 cluster 是否为 'good' unit。", rec:"默认 0.2（20% 的不应期违规容忍度）。较严格设 0.1（更可能判定为噪声）；较宽松设 0.3-0.5。严格设置会产生更'纯'的 unit 但可能丢失一些真实的 spike；宽松设置保留更多 spike 但可能包含更多污染。"},
  {n:34, name:"ccg_threshold", alias:"CCG 不应期阈值", step:"clustering", type:"float", def:"0.25", range:"> 0", desc:"在 CCG（互相关图）中允许的、相对于基线的不应期违规比例。用于执行 cluster 的 split 和 merge 操作。", rec:"默认 0.25。此参数在合并相似 cluster 时起着关键的决策作用。较高的值会导致更多合并（过度合并），较低的值会导致更多分裂（过度分裂）。"},
  {n:35, name:"cluster_neighbors", alias:"聚类最近邻数", step:"clustering", type:"int", def:"10", range:"≥ 2", desc:"在 clustering_qr.neigh_mat 中为每个 spike 搜索的最近邻数量，用于构建聚类图的邻接矩阵。更改此参数会影响资源使用和排序时间。", rec:"默认 10。增大可改善聚类精度但会增加内存使用和计算时间。对于非常大的数据集，可考虑减小到 5-7 以节省资源。"},
  {n:36, name:"cluster_downsampling", alias:"聚类下采样因子", step:"clustering", type:"int", def:"20", range:"≥ 1", desc:"聚类中用于地标（landmark）的 spike 比例的倒数。默认每 20 个 spike 使用 1 个作为地标。实际使用的 spike 数量还受 max_cluster_subset 的上限控制。", rec:"默认 20。对于大多数数据 5-20 之间的值都能良好工作。设为 1 表示使用所有 spike（最精确但最慢、最耗内存）。"},
  {n:37, name:"max_cluster_subset", alias:"聚类最大子集", step:"clustering", type:"int 或 None", def:"25000", range:"≥ 1 (None = 无限制)", desc:"聚类中用于搜索最近邻的最大 spike 数量。防止对于极长记录，聚类子集无限制增长。设为 None 表示不设上限（旧版行为）。", rec:"默认 25000。对于大多数情况足够。若聚类结果似乎过粗糙，可增加到 50000；若内存紧张可减小到 10000。设为 None 使用所有可用 spike（不推荐，大多数情况下不必要且会造成性能瓶颈）。"},
  {n:38, name:"x_centers", alias:"X 方向聚类中心数", step:"clustering", type:"int", def:"None (自动检测)", range:"≥ 1", desc:"为模板分组确定中心点时，使用的 x 位置数量。当设为 None 时，通过检测通道密度的峰值来自动确定。", rec:"对于 Neuropixels 1/2 等单列探针，自动检测即可（通常为 1）。对于 2D 阵列探针，建议手动指定，每隔几百微米设置一个中心。例如，一个 4 列探针可以设 x_centers=4。"},
  {n:39, name:"cluster_init_seed", alias:"聚类初始化随机种子", step:"clustering", type:"int", def:"5", range:"≥ 1", desc:"用于聚类图初始化的 kmeans++ 算法的随机种子。", rec:"默认 5。一般无需修改。若要确保可重复性，可固定为任意值。"},

  // EXTRA - Postprocessing
  {n:40, name:"duplicate_spike_ms", alias:"重复 spike 去除窗口", step:"postprocessing", type:"float", def:"0.25", range:"≥ 0 (0=禁用)", desc:"对于同一 cluster，在此时间窗口（毫秒）内出现的后续 spike 被假定为伪迹而移除。默认值 0.25ms 等价于旧版参数 duplicate_spike_bins=7（@30kHz）。", rec:"默认 0.25 ms。对应于典型的不应期窗口。若要保留所有 spike，可设为 0。此参数替代了已弃用的 duplicate_spike_bins。"},
  {n:41, name:"position_limit", alias:"位置估计最大距离", step:"postprocessing", type:"float", def:"100", range:"≥ 0", desc:"在 postprocessing.compute_spike_positions 中用于估计 spike 位置的通道间最大距离（微米）。不影响 spike 排序本身，仅影响排序后位置估计方式。", rec:"默认 100 μm。较小的值使位置估计更局部，较大值则使用更广泛的通道来计算位置。"},

  // Runtime
  {n:42, name:"do_CAR", alias:"共平均参考", step:"runtime", type:"bool", def:"True", range:"—", desc:"是否在预处理中应用共平均参考（Common Average Reference）。减除所有通道均值的操作，可有效去除共模噪声。", rec:"默认 True。强烈推荐保持开启，除非有特定原因（如通道数很少的 tetrode 数据）。"},
  {n:43, name:"invert_sign", alias:"反转信号", step:"runtime", type:"bool", def:"False", range:"—", desc:"是否翻转数据的正负值以符合 Kilosort4 期望的标准。", rec:"默认 False。不推荐修改，除非确认数据使用了相反的符号约定。"},
  {n:44, name:"clear_cache", alias:"清除 GPU 缓存", step:"runtime", type:"bool", def:"False", range:"—", desc:"是否在内存密集型操作之间强制 PyTorch 释放 GPU 缓存内存。", rec:"默认 False。不推荐设为 True，除非遇到 GPU 内存不足错误（OOM），因为它会导致排序变慢。"},
  {n:45, name:"save_preprocessed_copy", alias:"保存预处理数据", step:"runtime", type:"bool", def:"False", range:"—", desc:"是否将经过预处理（白化、滤波、漂移校正）的数据副本保存到 temp_wh.dat，并相应修改 Phy 输出格式。", rec:"默认 False。仅在需要在 Phy 中手动策展并且偏好使用预处理后的数据时开启。会占用额外磁盘空间。"},
  {n:46, name:"verbose_log", alias:"详细日志", step:"runtime", type:"bool", def:"False", range:"—", desc:"是否在日志中包含额外的调试级信息。提供更多细节用于调试，但可能影响性能。", rec:"默认 False。仅在调试问题时开启。"},
  {n:47, name:"data_dtype", alias:"数据类型", step:"runtime", type:"str", def:"'int16'", range:"—", desc:"二进制文件中数据的 dtype。", rec:"默认 'int16'（大多数采集系统使用）。如果数据以其他格式存储（如 'uint16'、'float32'），必须指定此参数。"},
  {n:48, name:"device", alias:"PyTorch 计算设备", step:"runtime", type:"torch.device", def:"None (自动选择)", range:"—", desc:"用于 PyTorch 计算的计算设备（CPU 或 GPU）。", rec:"默认自动。有 NVIDIA GPU 时强烈推荐使用 GPU（极大加速）；无 GPU 时使用 CPU。"},
  {n:49, name:"torch_thread_lim", alias:"PyTorch 线程限制", step:"runtime", type:"int", def:"None", range:"—", desc:"限制 PyTorch 在 CPU 上使用的线程数。参见 torch.set_num_threads。", rec:"默认 None。仅在多核 CPU 上需要控制资源使用时设置。"},
  {n:50, name:"bad_channels", alias:"排除通道", step:"runtime", type:"list", def:"None", range:"—", desc:"应从排序中排除的通道索引列表（二进制文件中的行号）。在列表中的通道等效于从探针字典中移除。", rec:"默认 None。仅在有已知坏通道（如高噪声、无信号）时指定。"},
  {n:51, name:"verbose_console", alias:"控制台详细输出", step:"runtime", type:"bool", def:"False", range:"—", desc:"是否将控制台日志级别设为 DEBUG 而非 INFO，使通常仅写入日志文件的额外信息实时显示。", rec:"默认 False。仅在需要实时监控排序详细过程时开启。"}
];

const stepCN = {data:"数据","preprocessing":"预处理","spike detection":"Spike检测",clustering:"聚类",postprocessing:"后处理",runtime:"运行时"};
const stepColors = {data:"#58a6ff","preprocessing":"#3fb950","spike detection":"#d29922",clustering:"#f78166",postprocessing:"#bc8cff",runtime:"#8b949e"};

// ===== STATE =====
let viewMode = 'cards'; // 'cards' | 'table'
let activeSteps = new Set(["data","preprocessing","spike detection","clustering","postprocessing","runtime"]);
let searchTerm = '';
let sortKey = null, sortDir = 1;

// ===== RENDER CARDS =====
function highlight(text, term) {
  if (!term) return text;
  const re = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi');
  return text.replace(re, '<mark>$1</mark>');
}

function buildCard(p, term) {
  const escapedName = p.name.replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const stepCls = p.step.replace(/\s+/g,'-');
  return `
  <div class="param-card" data-step="${p.step}" data-search-text="${p.name} ${p.alias} ${p.desc} ${p.rec} ${p.type} ${p.def} ${p.step}">
    <div class="num">#${p.n}</div>
    <div class="name">${highlight(escapedName, term)}</div>
    <div class="alias">${highlight(p.alias, term)}</div>
    <div class="props">
      <span class="prop"><span class="pk">默认</span> <span class="pv">${highlight(String(p.def), term)}</span></span>
      <span class="prop"><span class="pk">类型</span> <span class="pv">${highlight(p.type, term)}</span></span>
      <span class="prop"><span class="pk">范围</span> <span class="pv">${highlight(p.range, term)}</span></span>
    </div>
    <div class="desc">${highlight(p.desc, term)}</div>
    <div class="recommend"><strong>&#128161; 推荐：</strong>${highlight(p.rec, term)}</div>
    <div class="tags"><span class="tag ${stepCls}">${stepCN[p.step] || p.step}</span></div>
  </div>`;
}

function renderCards(term) {
  const grid = document.getElementById('cardView');
  // Group by step
  const grouped = {};
  for (const p of params) {
    if (!activeSteps.has(p.step)) continue;
    // Filter
    if (term) {
      const hay = (p.name+' '+p.alias+' '+p.desc+' '+p.rec+' '+p.type+' '+String(p.def)+' '+p.step).toLowerCase();
      if (!hay.includes(term.toLowerCase())) continue;
    }
    if (!grouped[p.step]) grouped[p.step] = [];
    grouped[p.step].push(p);
  }
  let html = '';
  let visible = 0;
  for (const [step, items] of Object.entries(grouped)) {
    html += `<div class="section-hd"><h2>${stepCN[step] || step} <span class="st">(${items.length} params)</span></h2></div>`;
    for (const p of items) {
      html += buildCard(p, term);
      visible++;
    }
  }
  grid.innerHTML = html || '<div style="grid-column:1/-1;text-align:center;padding:48px;color:var(--text2)">没有匹配的参数，尝试修改搜索词或筛选条件。</div>';
  document.getElementById('resultCount').textContent = `${visible} / ${params.filter(p=>activeSteps.has(p.step)).length}`;
}

// ===== RENDER TABLE =====
function renderTable(term) {
  const tbody = document.querySelector('#quickTable tbody');
  let rows = [];
  for (const p of params) {
    if (!activeSteps.has(p.step)) continue;
    if (term) {
      const hay = (p.name+' '+p.alias+' '+p.desc+' '+p.rec+' '+p.type+' '+String(p.def)+' '+p.step).toLowerCase();
      if (!hay.includes(term.toLowerCase())) continue;
    }
    rows.push(p);
  }
  // Sort
  if (sortKey) {
    rows.sort((a,b) => {
      let va, vb;
      if (sortKey === 'num') { va = a.n; vb = b.n; }
      else if (sortKey === 'name') { va = a.name; vb = b.name; }
      else if (sortKey === 'default') { va = String(a.def); vb = String(b.def); }
      else if (sortKey === 'type') { va = a.type; vb = b.type; }
      else if (sortKey === 'step') { va = a.step; vb = b.step; }
      else if (sortKey === 'range') { va = a.range; vb = b.range; }
      if (va < vb) return -1 * sortDir;
      if (va > vb) return 1 * sortDir;
      return 0;
    });
  }
  let html = '';
  for (const p of rows) {
    const escapedName = p.name.replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const summary = p.desc.length > 80 ? p.desc.slice(0,80)+'…' : p.desc;
    html += `<tr data-step="${p.step}">
      <td>${p.n}</td>
      <td class="pn">${highlight(escapedName, term)}</td>
      <td class="pd">${highlight(String(p.def), term)}</td>
      <td>${highlight(p.type, term)}</td>
      <td><span class="tag ${p.step.replace(/\s+/g,'-')}" style="font-size:0.7rem">${stepCN[p.step]||p.step}</span></td>
      <td>${highlight(p.range, term)}</td>
      <td style="font-size:0.82rem;color:var(--text2)">${highlight(summary, term)}</td>
    </tr>`;
  }
  tbody.innerHTML = html;
  document.getElementById('resultCount').textContent = `${rows.length} / ${params.filter(p=>activeSteps.has(p.step)).length}`;
}

// ===== FILTER =====
function applyFilters() {
  if (viewMode === 'cards') renderCards(searchTerm);
  else renderTable(searchTerm);
}

document.getElementById('search').addEventListener('input', function(e) {
  searchTerm = e.target.value.trim();
  applyFilters();
});

document.getElementById('filterBadges').addEventListener('click', function(e) {
  if (!e.target.classList.contains('badge')) return;
  const step = e.target.dataset.step;
  if (activeSteps.has(step)) {
    if (activeSteps.size > 1) { activeSteps.delete(step); e.target.classList.remove('active'); }
  } else {
    activeSteps.add(step); e.target.classList.add('active');
  }
  applyFilters();
});

// ===== VIEW TOGGLE =====
document.getElementById('toggleView').addEventListener('click', function() {
  if (viewMode === 'cards') {
    viewMode = 'table';
    document.getElementById('cardView').style.display = 'none';
    document.getElementById('tableView').style.display = 'block';
    document.getElementById('viewLabel').innerHTML = '&#128202; 速查表视图';
    this.textContent = '切换到卡片视图';
    renderTable(searchTerm);
  } else {
    viewMode = 'cards';
    document.getElementById('cardView').style.display = '';
    document.getElementById('tableView').style.display = 'none';
    document.getElementById('viewLabel').innerHTML = '&#128203; 详细卡片视图';
    this.textContent = '切换到速查表视图';
    renderCards(searchTerm);
  }
});

// ===== TABLE SORT =====
document.querySelector('#quickTable thead').addEventListener('click', function(e) {
  const th = e.target.closest('th');
  if (!th || !th.dataset.sort) return;
  const key = th.dataset.sort;
  if (sortKey === key) { sortDir *= -1; }
  else { sortKey = key; sortDir = 1; }
  // Update arrows
  this.querySelectorAll('th .arr').forEach(a => a.textContent = '');
  th.querySelector('.arr').textContent = sortDir === 1 ? '▲' : '▼';
  renderTable(searchTerm);
});

// ===== KEYBOARD SHORTCUTS =====
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('search').focus();
  }
  if (e.key === 'Escape') {
    document.getElementById('search').value = '';
    searchTerm = '';
    applyFilters();
  }
});

// ===== INIT =====
renderCards('');
</script>
</body>
</html>
